<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 投影片生成器</title>
    <link rel="stylesheet" href="src/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GHGBM401HN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GHGBM401HN');
</script>
</head>

<body>
    <div id="toastContainer"></div>

    <div class="app-container">
        <div class="top-bar">
            <h1>Markdown 投影片生成器</h1>
            <div class="navigation-controls">
                <button id="prevBtn" class="btn btn-secondary" disabled>← 上一頁</button>
                <span id="slideCounter" class="slide-counter">0 / 0</span>
                <button id="nextBtn" class="btn btn-secondary" disabled>下一頁 →</button>
            </div>
        </div>

        <div class="theme-bar">
            <span class="theme-bar-label">🎨 主題配色:</span>
            <div class="theme-selector" id="themeSelector">
                <div class="theme-option active" data-theme="modern-blue">
                    <div>現代藍</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #1e40af;"></div>
                        <div class="color-dot" style="background-color: #3b82f6;"></div>
                        <div class="color-dot" style="background-color: #f0f9ff;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="warm-sunset">
                    <div>溫暖日落</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #ea580c;"></div>
                        <div class="color-dot" style="background-color: #f97316;"></div>
                        <div class="color-dot" style="background-color: #fff7ed;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="forest-green">
                    <div>森林綠</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #15803d;"></div>
                        <div class="color-dot" style="background-color: #22c55e;"></div>
                        <div class="color-dot" style="background-color: #f0fdf4;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="purple-dream">
                    <div>紫色夢幻</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #6d28d9;"></div>
                        <div class="color-dot" style="background-color: #a855f7;"></div>
                        <div class="color-dot" style="background-color: #faf5ff;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="dark-mode">
                    <div>暗黑模式</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #1f2937;"></div>
                        <div class="color-dot" style="background-color: #60a5fa;"></div>
                        <div class="color-dot" style="background-color: #111827;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="aqua-fresh">
                    <div>海洋青</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #0891b2;"></div>
                        <div class="color-dot" style="background-color: #22d3ee;"></div>
                        <div class="color-dot" style="background-color: #f8fafc;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="crimson-focus">
                    <div>鮮紅焦點</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #dc2626;"></div>
                        <div class="color-dot" style="background-color: #f87171;"></div>
                        <div class="color-dot" style="background-color: #1f2937;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="sand-classic">
                    <div>經典沙漠</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #a16207;"></div>
                        <div class="color-dot" style="background-color: #ca8a04;"></div>
                        <div class="color-dot" style="background-color: #fefce8;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="teal-minimal">
                    <div>極簡青綠</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #0d9488;"></div>
                        <div class="color-dot" style="background-color: #2dd4bf;"></div>
                        <div class="color-dot" style="background-color: #f0fdfa;"></div>
                    </div>
                </div>
                <div class="theme-option" data-theme="amber-night">
                    <div>夜間琥珀</div>
                    <div class="theme-colors">
                        <div class="color-dot" style="background-color: #d97706;"></div>
                        <div class="color-dot" style="background-color: #f59e0b;"></div>
                        <div class="color-dot" style="background-color: #1f2937;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <div class="panel-header">
                    <span>Markdown 編輯器</span>
                    <div class="flex gap-2">
                        <button id="insertPageBreakBtn" class="btn btn-secondary btn-sm" title="插入分頁符">📄 分頁</button>
                        <button id="loadExampleBtn" class="btn btn-secondary btn-sm">載入範例</button>
                    </div>
                </div>
                <textarea id="markdownInput" class="markdown-editor" placeholder="在此輸入 Markdown 內容...
使用 --- 分隔每一頁投影片"></textarea>
                <div class="editor-hint">
                    💡 提示：使用 <code>#</code> 標題、<code>-</code> 列表、<code>---</code> 分頁
                </div>
            </div>

            <div class="center-panel">
                <div class="slide-container" id="slideContainer">
                </div>
                <div class="progress-bar" style="margin-top: 8px; max-width: 900px;">
                    <div id="progressBar"></div>
                </div>
                <div class="thumbnail-bar" id="thumbnailBar">
                </div>
            </div>

            <div class="right-panel">
                <details open>
                    <summary>投影片設定</summary>
                    <div class="control-group">
                        <div class="control-label">動畫效果</div>
                        <select id="animationSelect" class="form-control">
                            <option value="fade">淡入 (Fade)</option>
                            <option value="slide">滑入 (Slide)</option>
                            <option value="zoom">縮放 (Zoom)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <div class="control-label">內文對齊</div>
                        <select id="alignmentSelect" class="form-control">
                            <option value="left">靠左</option>
                            <option value="center">置中</option>
                            <option value="right">靠右</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <div class="control-label">標題對齊</div>
                        <select id="titleAlignmentSelect" class="form-control">
                            <option value="left">靠左</option>
                            <option value="center">置中</option>
                            <option value="right">靠右</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <div class="control-label">背景樣式</div>
                        <select id="backgroundStyleSelect" class="form-control">
                            <option value="solid">單色背景</option>
                            <option value="gradient">漸層背景</option>
                        </select>
                    </div>
                </details>

                <details>
                    <summary>匯出設定</summary>
                    <div class="control-group">
                        <div class="control-label">標題字大小 (em)</div>
                        <input type="number" id="exportH1Size" class="form-control" value="3.5" step="0.1" min="1" max="8">
                    </div>
                    <div class="control-group">
                        <div class="control-label">副標題字大小 (em)</div>
                        <input type="number" id="exportH2Size" class="form-control" value="2.5" step="0.1" min="1" max="6">
                    </div>
                    <div class="control-group">
                        <div class="control-label">內文字大小 (em)</div>
                        <input type="number" id="exportPSize" class="form-control" value="1.3" step="0.1" min="0.8" max="3">
                    </div>
                </details>

                <details>
                    <summary>操作</summary>
                    <div class="control-group">
                        <button id="exportBtn" class="btn btn-primary btn-full">📥 匯出 HTML</button>
                        <button id="fullscreenBtn" class="btn btn-secondary btn-full" style="margin-top: 8px;">🖥️ 全螢幕播放</button>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script src="src/app.js"></script>
</body>

</html>
